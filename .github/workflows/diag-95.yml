name: Temporary issue #95 diagnostics

on:
  push:
    branches: [fix/lottery-landing-webkit]
  workflow_dispatch:

permissions:
  contents: read

env:
  E2E_HOST: 127.0.0.1

jobs:
  desktop-chromium:
    name: Issue #95 diagnostics (desktop-chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e4337d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install browser and OS dependencies
        env:
          BROWSER: chromium
        run: npx playwright install --with-deps "$BROWSER"
      - name: Run issue #95 diagnostics
        env:
          DIAG_95: "1"
        run: xvfb-run --auto-servernum npx playwright test tests/e2e/diag-95.spec.ts --project=desktop-chromium --repeat-each=30 --retries=0 --workers=1
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diag-95-desktop-chromium
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  desktop-webkit:
    name: Issue #95 diagnostics (desktop-webkit)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check Playwright image version
        run: |
          image_version=1.63.0
          package_version="$(node -p "require('@playwright/test/package.json').version")"
          if [[ "$package_version" != "$image_version" ]]; then
            echo "::error::Playwright image v${image_version}-noble does not match @playwright/test ${package_version}. Bump the image tag in the same PR as the Playwright package."
            exit 1
          fi
      - name: Run issue #95 diagnostics
        env:
          DIAG_95: "1"
        run: xvfb-run --auto-servernum npx playwright test tests/e2e/diag-95.spec.ts --project=desktop-webkit --repeat-each=30 --retries=0 --workers=1
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diag-95-desktop-webkit
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
