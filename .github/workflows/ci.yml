name: CI

# Decision D (2026-11-12, issue #83; supersedes decision B of 2026-10-20,
# which ran CI on push only). A push to a working branch runs E2E on
# desktop-chromium only; a PR into develop/master, a push to develop/master
# and a manual dispatch run all four projects.
# Rulesets protect-develop / protect-master match required checks by name on
# the PR head SHA, whatever event produced them. So only full-scope runs may
# use the name "E2E (Playwright)"; the quick run is named differently and can
# never satisfy it. Frontend and pipeline run on every event, PRs included:
# skipping them per event would leave same-named "skipped" (= passing) check
# runs on the head SHA beside the real ones. PRs from forks now get CI too.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

# Deployment stays with the Vercel Git integration; CI only runs quality gates.
permissions:
  contents: read

# Superseded pushes to a working branch are cancelled. Post-merge runs on
# develop/master are never cancelled, and a manual dispatch has its own group
# so it never cancels the push run of the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}

env:
  # The preview server binds IPv4 loopback on runners (the ::1 default in
  # playwright.config.ts is a WSL2 workaround).
  E2E_HOST: 127.0.0.1

jobs:
  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production bundle must not contain the E2E hook
        run: |
          if grep -q __sugorokuE2E dist/assets/*.js; then
            echo "::error::__sugorokuE2E found in the production bundle"
            exit 1
          fi

  pipeline:
    name: Data pipeline (ruff, ty, pytest, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The dev dependency-group (pytest, ruff, ty) is synced by default.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check scripts/
      # N02 raw data is gitignored, so tests/data_pipeline/test_build.py skips.
      - run: uv run pytest -q
      # Reads only the committed public/data/ and the override tables.
      - run: uv run python -m scripts.data_pipeline.validate

  # Decision D (2026-11-12): choose full or quick E2E scope once here. Keep the
  # full-scope event/ref rule in sync with the aggregate job name expression.
  # Docs-only changes on working-branch pushes and PRs may skip the selected
  # legs only when their merge-base has a passing E2E (Playwright) check.
  # Protected-branch pushes, manual dispatches, and every uncertain case run.
  changes:
    name: Detect E2E scope and docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      e2e: ${{ steps.detect.outputs.e2e }}
      matrix: ${{ steps.detect.outputs.matrix }}
      scope: ${{ steps.detect.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for merge-base; commits and trees only, which is all
          # `git diff --name-only` needs.
          fetch-depth: 0
          filter: blob:none
      - name: Decide whether E2E must run
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASELINE_REF: origin/develop
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_e2e() {
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "E2E runs: $1"
            exit 0
          }
          # Keep this scope rule in sync with the aggregate job name expression.
          case "$EVENT_NAME" in
            pull_request | workflow_dispatch)
              scope=full ;;
            push)
              case "$GIT_REF" in
                refs/heads/develop | refs/heads/master) scope=full ;;
                *) scope=quick ;;
              esac ;;
            *) scope=quick ;;
          esac
          if [ "$scope" = full ]; then
            matrix='{"include":[{"project":"desktop-chromium","browser":"chromium"},{"project":"phone-chromium","browser":"chromium"},{"project":"desktop-firefox","browser":"firefox"},{"project":"desktop-webkit","browser":"webkit"}]}'
          else
            matrix='{"include":[{"project":"desktop-chromium","browser":"chromium"}]}'
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_e2e "workflow_dispatch always runs the full suite"
          fi
          if [ "$EVENT_NAME" = push ]; then
            case "$GIT_REF" in
              refs/heads/master | refs/heads/develop)
                run_e2e "push to a protected branch always runs the full suite" ;;
            esac
            BASE_REF=$BASELINE_REF
            HEAD_SHA=$PUSH_HEAD_SHA
          elif [ "$EVENT_NAME" = pull_request ]; then
            BASE_REF=$PR_BASE_SHA
            HEAD_SHA=$PR_HEAD_SHA
          else
            run_e2e "event '$EVENT_NAME' always runs its configured scope"
          fi

          # Documentation only. Code, data, tests and CI paths never count,
          # even for a .md file inside them.
          is_docs() {
            case "$1" in
              public/* | src/* | tests/* | data/* | scripts/* | .github/*) return 1 ;;
              docs/*) return 0 ;;
              *.md) return 0 ;;
              *) return 1 ;;
            esac
          }
          if ! baseline=$(git merge-base "$BASE_REF" "$HEAD_SHA"); then
            run_e2e "no merge base with $BASE_REF"
          fi
          if ! changed=$(git diff --no-renames --name-only "$baseline" "$HEAD_SHA"); then
            run_e2e "git diff against $baseline failed"
          fi
          if [ -z "$changed" ]; then
            run_e2e "no change against $BASE_REF"
          fi
          while IFS= read -r path; do
            if ! is_docs "$path"; then
              run_e2e "non-docs change: $path"
            fi
          done <<< "$changed"
          # The latest GitHub Actions "E2E (Playwright)" check run(s) on this
          # merge-base (the API's default filter=latest) must be completed and
          # successful, and there must be at least one.
          if ! verdicts=$(gh api "repos/$REPO/commits/$baseline/check-runs?check_name=E2E%20(Playwright)&per_page=100" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions") | .conclusion // "pending"] | unique | join(",")'); then
            run_e2e "could not read the E2E result of $baseline"
          fi
          if [ "$verdicts" != success ]; then
            run_e2e "merge-base $baseline has no clean E2E pass ('$verdicts')"
          fi
          echo "e2e=false" >> "$GITHUB_OUTPUT"
          echo "Docs-only change against $BASE_REF ($baseline); E2E legs are skipped:"
          echo "$changed"

  # One leg per Playwright project (decision A, 2026-10-20): same tests,
  # 2 workers, retries, xvfb. Which legs run comes from `changes` (decision D):
  # all four for full scope, desktop-chromium only for quick scope.
  # Runs in parallel with `frontend`: it builds its own e2e bundle.
  e2e-matrix:
    name: E2E leg (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    # Pinned: ubuntu-latest moved to ubuntu-26.04 (2026-10-30) and Playwright's
    # WebKit build there fails to load libicudata.so.74.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      # OS dependencies are not cached, so they are always installed; a cache
      # hit only skips the browser download. Playwright always adds its
      # "tools" group (xvfb, CJK fonts) whichever browser is named.
      - name: Install browser and OS dependencies
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install --with-deps "$BROWSER"
      # Firefox WebGL2 on the runner (desktop-firefox flakes, 2026-10-20):
      # - Without Mesa's EGL the runner image has only GLX, and Firefox's GLX
      #   path fails ~1 in 20 times to create a WebGL2 context right after the
      #   page lost the previous one (map retry; FEATURE_FAILURE_WEBGL_
      #   EXHAUSTED_DRIVERS). With libegl-mesa0 Firefox uses EGL: 0 of 800.
      # - Firefox's launch-time GL probe (gfxtest) has a fixed 4 s deadline
      #   but took 3.8-7.7 s on a cold runner; a browser that misses it falls
      #   back to GLX and blocklists WebGL2. One throwaway launch loads the GL
      #   libraries so the probe then takes ~0.1 s.
      - name: Install Mesa EGL and warm up Firefox's GL probe
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0
          xvfb-run --auto-servernum npx playwright screenshot --browser=firefox about:blank "$RUNNER_TEMP/firefox-warm-up.png"
      # Headless Firefox on Linux only gets a GL backend (and so WebGL2, which
      # MapLibre requires) through an X display; runners have none, so Firefox
      # reports "AllowWebgl2:false" and the app never renders. Every leg keeps
      # the same wrapper; Chromium/WebKit stay headless under it.
      # No --pass-with-no-tests: a mistyped project must fail with
      # "No tests found".
      - name: Run E2E tests
        env:
          PROJECT: ${{ matrix.project }}
        run: xvfb-run --auto-servernum npm run test:e2e -- --project="$PROJECT"
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Full scope keeps the required status-check context "E2E (Playwright)";
  # quick scope reports "E2E quick (desktop-chromium)" (decision D). The name
  # uses only the github context, so it is fixed even if `changes` fails, and
  # its event/ref rule must stay in sync with the scope rule in `changes`.
  # Passes only when every selected leg succeeded, or when change detection
  # succeeded, chose docs-only, and the legs were skipped for that reason. A
  # failed, cancelled or otherwise skipped leg, or a failed detection job,
  # fails it.
  e2e:
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'))) && 'E2E (Playwright)' || 'E2E quick (desktop-chromium)' }}
    needs: [changes, e2e-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every E2E leg to pass, or a docs-only skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_E2E: ${{ needs.changes.outputs.e2e }}
          MATRIX_RESULT: ${{ needs.e2e-matrix.result }}
        run: |
          echo "changes=$CHANGES_RESULT e2e=$RUN_E2E legs=$MATRIX_RESULT"
          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::Docs-only detection did not succeed ($CHANGES_RESULT)"
            exit 1
          fi
          if [ "$RUN_E2E" = true ] && [ "$MATRIX_RESULT" = success ]; then
            exit 0
          fi
          if [ "$RUN_E2E" = false ] && [ "$MATRIX_RESULT" = skipped ]; then
            echo "::notice::Docs-only change: E2E legs were skipped"
            exit 0
          fi
          echo "::error::E2E legs ended '$MATRIX_RESULT' (e2e=$RUN_E2E)"
          exit 1
